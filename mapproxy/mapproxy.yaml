services:
  tms:
    use_grid_names: true
    origin: 'nw'
  wmts:
    restful: true
    kvp: true
  wms:
    srs: ['EPSG:3857', 'EPSG:4326', 'EPSG:3844']
    image_formats: ['image/png', 'image/jpeg']
    bbox_srs: ['EPSG:3857', 'EPSG:4326', 'EPSG:3844']
    versions: ['1.1.1', '1.3.0']

layers:
  # Layere native în EPSG:3844 (Stereo 70) — folosite de OL view 3844 fără reproject
  - name: ortoplan
    title: Ortofotoplan Romania (ANCPI) — Stereo 70
    sources: [ortoplan_stereo70_cache]

  - name: osm
    title: OpenStreetMap — Stereo 70
    sources: [osm_stereo70_cache]

  # Variante webmercator (legacy, pentru clienți care lucrează în 3857)
  - name: ortoplan_3857
    title: Ortofotoplan Romania (ANCPI) — Web Mercator
    sources: [ortoplan_3857_cache]

  - name: osm_3857
    title: OpenStreetMap — Web Mercator
    sources: [osm_3857_cache]

caches:
  ortoplan_stereo70_cache:
    grids: [stereo70]
    sources: [ortoplan_wms]
    format: image/jpeg
    cache:
      type: file
      directory: ./mapproxy/cache_data/ortoplan_stereo70

  osm_stereo70_cache:
    grids: [stereo70]
    sources: [osm_tiles]
    format: image/png
    cache:
      type: file
      directory: ./mapproxy/cache_data/osm_stereo70

  ortoplan_3857_cache:
    grids: [webmercator]
    sources: [ortoplan_wms]
    format: image/jpeg
    cache:
      type: file
      directory: ./mapproxy/cache_data/ortoplan

  osm_3857_cache:
    grids: [webmercator]
    sources: [osm_tiles]
    format: image/png
    cache:
      type: file
      directory: ./mapproxy/cache_data/osm

sources:
  ortoplan_wms:
    type: wms
    req:
      # URL WMS ortofotoplan ANCPI — editați dacă aveți alt endpoint sau credențiale
      url: "https://geoportal.ancpi.ro/maps/services/ortoplan/MapServer/WMSServer"
      layers: "0"
      transparent: false
    coverage:
      bbox: [20.0, 43.5, 30.0, 48.5]
      srs: 'EPSG:4326'
    http:
      ssl_no_cert_checks: true
      timeout: 30

  osm_tiles:
    type: tile
    url: https://tile.openstreetmap.org/%(z)s/%(x)s/%(y)s.png
    grid: webmercator
    http:
      headers:
        User-Agent: MapProxy/e-cad-2026

grids:
  webmercator:
    base: GLOBAL_WEBMERCATOR

  # Grid custom Stereo 70 (EPSG:3844) — acoperă teritoriul României
  # Origin NW: (120000 E, 800000 N); resoluții descendente la fiecare zoom level
  stereo70:
    srs: EPSG:3844
    bbox: [120000, 250000, 900000, 800000]
    bbox_srs: EPSG:3844
    origin: nw
    tile_size: [256, 256]
    res: [3072, 1536, 768, 384, 192, 96, 48, 24, 12, 6, 3, 1.5, 0.75, 0.375, 0.1875]

globals:
  cache:
    base_dir: ./mapproxy/cache_data
    lock_dir: ./mapproxy/cache_data/locks
    concurrent_tile_creators: 2
  http:
    access_control_allow_origin: '*'
    ssl_no_cert_checks: true
  image:
    resampling_method: bicubic
