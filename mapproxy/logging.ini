[loggers]
keys=root,mapproxy

[handlers]
keys=console

[formatters]
keys=generic

[logger_root]
level=WARNING
handlers=console

[logger_mapproxy]
level=INFO
handlers=console
qualname=mapproxy
propagate=0

[handler_console]
class=StreamHandler
args=(sys.stderr,)
level=INFO
formatter=generic

[formatter_generic]
format=%(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt=%Y-%m-%d %H:%M:%S
